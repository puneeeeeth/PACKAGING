<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report | Packaging Management System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="page-header"><img class="bosch-logo" th:src="@{/images/bosch-logo.png}" alt="Bosch"><a class="home-link" th:href="@{/}">Home</a><h1>Report</h1></header>
<main class="page-shell">
    <p class="message error" th:if="${error}" th:text="${error}"></p>
    <section class="panel">
        <h2>Production Report Filters</h2>
        <form class="filter-form" method="get" th:action="@{/report}">
            <label>From date<input type="date" name="fromDate" th:value="${fromDate}"></label>
            <label>To date<input type="date" name="toDate" th:value="${toDate}"></label>
            <label>Operator name<input type="search" name="operatorName" th:value="${operatorName}"></label>
            <label>Part number<select name="partId"><option value="">All parts</option>
                <option th:each="part : ${parts}" th:value="${part.id}" th:selected="${partId != null and part.id == partId}" th:text="${part.code}"></option>
            </select></label>
            <label>Market<select name="markId"><option value="">All markets</option>
                <option th:each="market : ${markets}" th:value="${market.id}" th:selected="${markId != null and market.id == markId}" th:text="${market.code}"></option>
            </select></label>
            <button type="submit">Generate Report</button>
            <a class="button-link secondary-button" th:href="@{/report}">Clear Filters / View All</a>
        </form>
    </section>

    <section class="panel" id="generated-report" th:if="${report != null}">
        <div class="report-heading">
            <div><p class="eyebrow">SAVED PRODUCTION RECORDS</p><h2>Production Report</h2>
                <p>Date range: <span th:text="${report.fromDate != null ? report.fromDate : 'All dates'}"></span> to
                    <span th:text="${report.toDate != null ? report.toDate : 'All dates'}"></span></p>
                <p>Generated: <span th:text="${report.generatedAt}"></span></p>
            </div>
            <div class="actions report-actions">
                <a class="button-link secondary-button" href="#generated-report">View Report</a>
                <a class="button-link" th:href="@{/report/export/excel(fromDate=${fromDate},toDate=${toDate},operatorName=${operatorName},partId=${partId},markId=${markId})}">Export to Excel</a>
                <a class="button-link" target="_blank" th:href="@{/report/print(fromDate=${fromDate},toDate=${toDate},operatorName=${operatorName},partId=${partId},markId=${markId})}">Print Report</a>
            </div>
        </div>
        <div class="table-scroll"><table><thead><tr><th>Name</th><th>Part Number</th><th>Market</th><th>Quantity</th></tr></thead>
            <tbody><tr th:each="row : ${report.production}"><td th:text="${row.operatorName}"></td><td th:text="${row.partNumber}"></td><td th:text="${row.markName}"></td><td th:text="${row.quantity}"></td></tr>
                <tr th:if="${#lists.isEmpty(report.production)}"><td colspan="4">No production records match the selected filters.</td></tr></tbody>
            <tfoot><tr><th colspan="3">Grand Total Production</th><th th:text="${report.productionTotal}"></th></tr></tfoot>
        </table></div>
    </section>
</main>
</body>
</html>
