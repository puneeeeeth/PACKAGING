<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Report | Packaging Management System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="print-page">
<main class="page-shell">
    <div class="actions no-print"><button type="button" onclick="window.print()">Print / Save as PDF</button></div>
    <header class="report-heading"><img class="bosch-logo" th:src="@{/images/bosch-logo.png}" alt="Bosch"><div><h1>Packaging Management System</h1><h2>Production Report</h2>
        <p>Date range: <span th:text="${report.fromDate != null ? report.fromDate : 'All dates'}"></span> to
            <span th:text="${report.toDate != null ? report.toDate : 'All dates'}"></span></p>
        <p>Generated: <span th:text="${report.generatedAt}"></span></p>
    </div></header>
    <table><thead><tr><th>Name</th><th>Part Number</th><th>Market</th><th>Quantity</th></tr></thead>
        <tbody><tr th:each="row : ${report.production}"><td th:text="${row.operatorName}"></td><td th:text="${row.partNumber}"></td><td th:text="${row.markName}"></td><td th:text="${row.quantity}"></td></tr>
            <tr th:if="${#lists.isEmpty(report.production)}"><td colspan="4">No production records matched the selected filters.</td></tr></tbody>
        <tfoot><tr><th colspan="3">Grand Total Production</th><th th:text="${report.productionTotal}"></th></tr></tfoot>
    </table>
</main>
</body>
</html>
